[project]
name = "drones"
version = "0.1.0"
description = "Crazyflie 2.1 Brushless flight software: shared control law, phone teleop and autonomous missions"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cflib>=0.1.33",
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pydantic>=2.13",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
    "websockets>=17.1",
]

[project.scripts]
drones-web = "drones.teleop.web.server:main"
drones-wall-avoid = "drones.missions.wall_avoid:main"
drones-train-hover = "drones.rl.train_hover:main"
drones-eval-hover = "drones.rl.evaluate:main"
drones-render-hover = "drones.rl.render:main"
drones-export-policy = "drones.rl.export:main"
drones-train-square = "drones.rl.train_square:main"
drones-eval-square = "drones.rl.evaluate_square:main"
drones-render-square = "drones.rl.render_square:main"
drones-download-scenes = "drones.sim.scenes:main"
drones-explore-scene = "drones.sim.explore:main"
drones-render-agent = "drones.sim.render_agent:main"
drones-finetune-square = "drones.rl.finetune_square:main"
drones-fly-policy = "drones.missions.fly_policy:main"
drones-fly-square = "drones.missions.fly_square:main"
drones-camera = "drones.crazyflie.camera:main"
drones-fpv = "drones.teleop.web.server:main_fpv"

[project.optional-dependencies]
sim = [
    "crazyflow>=0.3.2",
    "flax>=0.12.9",
    "imageio>=2.37",
    "imageio-ffmpeg>=0.6",
    "modelscope>=1.40.1",
    "optax>=0.2.8",
    "pillow>=12.3",
    "pyyaml>=6.0.3",
    "wasmtime>=49.0",
]
gpu = [
    "jax[cuda12]>=0.11.1 ; sys_platform == 'linux'",
]
camera = [
    "opencv-python>=5.0.0.93",
]
# The VLM pilot's local model (drones.vlm.backend). Heavy: torch brings its CUDA libraries on
# Linux whether or not there is a GPU. Nothing else in the project needs it.
vlm = [
    "accelerate>=1.0",
    "lm-format-enforcer>=0.11.3",  # holds the model's reply to the chunk schema, token by token
    "pillow>=12.3",
    "timm>=1.0",  # Gemma 3n's vision tower loads through TimmWrapperModel
    "torch>=2.9",
    "transformers>=5.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The style the code already follows: 100 columns, single quotes.
line-length = 100

[tool.ruff.lint]
# B008 is excluded deliberately: `config: HoverConfig = HoverConfig()` is the idiom
# throughout sim/ and rl/, and every one of those config dataclasses is frozen, so the
# shared-mutable-default hazard the rule warns about cannot arise here.
select = ["E", "F", "W", "B"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "single"
